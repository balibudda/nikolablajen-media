name: "Событийный календарь (Mercury retrograde / eclipse corridor)"

# Event-based content calendar (BACKLOG.md "Building now", 2026-09-05 —
# Studio's pitch: post about a real astronomical/astrological event BEFORE
# it happens, riding the search spike). scripts/social/astro-events.mjs
# holds real, web-search-verified 2026-2027 eclipse + Mercury retrograde
# dates; generate-video-astro-event.mjs checks for one landing within
# --lookahead days and renders a single-segment video about it.
#
# LIVE weekly cron since 2026-09-05 (Nick: "давай раз в неделю") — most
# weeks find nothing within the lookahead window and no-op cleanly. The
# resolved event id isn't known until the generate step actually runs, so
# every downstream "Post to X" step reads it from that step's own GITHUB_
# OUTPUT (steps.gen_ru.outputs.event_id / .found) instead of a workflow
# input. generate-video-astro-event.mjs also keys its OWN idempotency by
# event id (not by date) — so if the same upcoming event is still inside
# the lookahead window on a later weekly check, it's correctly skipped
# instead of posted again.

on:
  schedule:
    - cron: '0 20 * * 1'  # weekly, Monday ~20:00 UTC (~03:00 Tue Bangkok)
  workflow_dispatch:
    inputs:
      only:
        description: Which language(s) to post
        type: choice
        default: both
        options: [both, ru, en]
      event:
        description: 'Optional: force a specific event id from astro-events.mjs ASTRO_EVENTS (leave blank for auto-detect via --lookahead)'
        type: string
        default: ''
      lookahead:
        description: 'Days to look ahead when --event is blank'
        type: string
        default: '21'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate astro-event video (RU)
        id: gen_ru
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'both' || github.event.inputs.only == 'ru' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/generate-video-astro-event.mjs --locale=ru ${{ github.event.inputs.event != '' && format('--event={0}', github.event.inputs.event) || format('--lookahead={0}', github.event.inputs.lookahead != '' && github.event.inputs.lookahead || '21') }}

      - name: Post to Instagram (RU → @bulejavan)
        if: ${{ steps.gen_ru.outputs.found == 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-instagram.mjs --suffix=astro-${{ steps.gen_ru.outputs.event_id }}-ru

      - name: Post to Facebook (RU → Bule Javan)
        if: ${{ always() && steps.gen_ru.outputs.found == 'true' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-facebook.mjs --suffix=astro-${{ steps.gen_ru.outputs.event_id }}-ru

      - name: Post to Telegram (RU → @nikolablajen_news)
        if: ${{ always() && steps.gen_ru.outputs.found == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-telegram.mjs --suffix=astro-${{ steps.gen_ru.outputs.event_id }}-ru

      - name: Post to VK (RU → community)
        if: ${{ always() && steps.gen_ru.outputs.found == 'true' }}
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-vk.mjs --suffix=astro-${{ steps.gen_ru.outputs.event_id }}-ru

      - name: Post to YouTube (RU → Shorts)
        if: ${{ always() && steps.gen_ru.outputs.found == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-youtube.mjs --locale=ru --suffix=astro-${{ steps.gen_ru.outputs.event_id }}-ru

      - name: Post to TikTok (RU → draft in @nikola.blajen's inbox)
        if: ${{ always() && steps.gen_ru.outputs.found == 'true' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-tiktok.mjs --suffix=astro-${{ steps.gen_ru.outputs.event_id }}-ru

      - name: Generate astro-event video (EN)
        id: gen_en
        if: ${{ always() && (github.event.inputs.only == '' || github.event.inputs.only == 'both' || github.event.inputs.only == 'en') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/generate-video-astro-event.mjs --locale=en ${{ github.event.inputs.event != '' && format('--event={0}', github.event.inputs.event) || format('--lookahead={0}', github.event.inputs.lookahead != '' && github.event.inputs.lookahead || '21') }}

      - name: Post to Instagram (EN → @nikolablajen.en)
        if: ${{ always() && steps.gen_en.outputs.found == 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_EN }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/social/post-instagram.mjs --suffix=astro-${{ steps.gen_en.outputs.event_id }}-en

      - name: Post to Facebook (EN → nikolablajen.en)
        if: ${{ always() && steps.gen_en.outputs.found == 'true' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_EN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_EN }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-facebook.mjs --suffix=astro-${{ steps.gen_en.outputs.event_id }}-en

      - name: Post to Bluesky (EN)
        if: ${{ always() && steps.gen_en.outputs.found == 'true' }}
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/social/post-bluesky.mjs --suffix=astro-${{ steps.gen_en.outputs.event_id }}-en

      - name: Post to Tumblr (EN)
        continue-on-error: true
        if: ${{ always() && steps.gen_en.outputs.found == 'true' }}
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_REFRESH_TOKEN: ${{ secrets.TUMBLR_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: node scripts/social/post-tumblr.mjs --suffix=astro-${{ steps.gen_en.outputs.event_id }}-en

      - name: Post to YouTube (EN → Shorts)
        if: ${{ always() && steps.gen_en.outputs.found == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-youtube.mjs --locale=en --suffix=astro-${{ steps.gen_en.outputs.event_id }}-en

      - name: Post to TikTok (EN → draft in @nikola.blajen7's inbox)
        if: ${{ always() && steps.gen_en.outputs.found == 'true' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_EN: ${{ secrets.TIKTOK_REFRESH_TOKEN_EN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_ASSETS_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-tiktok.mjs --locale=en --suffix=astro-${{ steps.gen_en.outputs.event_id }}-en

      - name: Upload video as artifact (debugging aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-event-video
          path: |
            dist-social/*-astro-*.mp4
            dist-social/*-astro-*.txt
            dist-social/*-astro-*.json
          retention-days: 7
